<!DOCTYPE html>
<html lang="en" data-theme="light" data-class="8">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="StudyMate — AI-powered study platform for Class 8, 9 & 10. Multilingual AI tutor, quizzes, flashcards, formulas, and more. Made by Ansil." />
<title>StudyMate AI — Learn Smarter</title>

<style>
/* ============================================================
   1. RESET & TOKENS
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

:root {
  --bg: #f4f6fb;
  --bg-2: #eef1f8;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --field: #f2f4f9;
  --border: #e4e7ef;
  --border-strong: #ccd2e0;

  --text: #131722;
  --text-soft: #4a5163;
  --text-muted: #8b93a7;

  --brand: #6366f1;
  --brand-soft: #818cf8;
  --brand-tint: rgba(99, 102, 241, 0.12);
  --brand-glow: rgba(99, 102, 241, 0.22);

  --ok: #10b981;
  --ok-soft: rgba(16, 185, 129, 0.14);
  --warn: #f59e0b;
  --err: #ef4444;
  --err-soft: rgba(239, 68, 68, 0.12);

  --shadow-sm: 0 1px 3px rgba(20, 25, 40, 0.05);
  --shadow-md: 0 8px 24px rgba(20, 25, 40, 0.08);
  --shadow-lg: 0 20px 50px rgba(20, 25, 40, 0.12);

  --radius: 16px;
  --radius-sm: 11px;
  --radius-lg: 22px;

  --sidebar-w: 260px;
}

/* ============================================================
   CLASS-THEMED BACKGROUNDS
   ============================================================ */

/* ─── Class 8 — PURE BLACK ─── */
[data-class="8"] {
  --bg: #000000;
  --bg-2: #0a0a0a;
  --surface: #0f0f0f;
  --surface-2: #171717;
  --field: #1c1c1c;
  --border: #262626;
  --border-strong: #383838;

  --text: #f0f0f0;
  --text-soft: #a8a8a8;
  --text-muted: #6b6b6b;

  --brand: #00ff99;
  --brand-soft: #00d97e;
  --brand-tint: rgba(0, 255, 153, 0.10);
  --brand-glow: rgba(0, 255, 153, 0.24);

  --hero-a: #00b368;
  --hero-b: #00ff99;
  --hero-glow: rgba(0, 255, 153, 0.35);

  --cyber-glow-1: rgba(0, 255, 153, 0.06);
  --cyber-glow-2: rgba(0, 200, 255, 0.04);

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.8);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.7);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.85);

  --ok-soft: rgba(0, 255, 153, 0.14);
  --err-soft: rgba(255, 90, 90, 0.14);
}

/* Class 8 in dark mode — identical (always black) */
[data-theme="dark"][data-class="8"] {
  --bg: #000000;
  --bg-2: #0a0a0a;
  --surface: #0f0f0f;
  --surface-2: #171717;
  --field: #1c1c1c;
  --border: #262626;
  --border-strong: #383838;
  --text: #f0f0f0;
  --text-soft: #a8a8a8;
  --text-muted: #6b6b6b;
  --brand: #00ff99;
  --brand-soft: #00d97e;
  --brand-tint: rgba(0, 255, 153, 0.12);
  --brand-glow: rgba(0, 255, 153, 0.28);
  --hero-a: #00b368;
  --hero-b: #00ff99;
  --hero-glow: rgba(0, 255, 153, 0.4);
  --cyber-glow-1: rgba(0, 255, 153, 0.08);
  --cyber-glow-2: rgba(0, 200, 255, 0.05);
  --ok-soft: rgba(0, 255, 153, 0.16);
  --err-soft: rgba(255, 90, 90, 0.16);
}

/* ─── Class 9 — Blue ─── */
[data-class="9"] {
  --bg: #eff6ff;
  --bg-2: #dbeafe;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --field: #f2f4f9;
  --border: #e4e7ef;
  --border-strong: #ccd2e0;
  --text: #131722;
  --text-soft: #4a5163;
  --text-muted: #8b93a7;
  --brand: #3b82f6;
  --brand-soft: #60a5fa;
  --brand-tint: rgba(59, 130, 246, 0.12);
  --brand-glow: rgba(59, 130, 246, 0.24);
  --hero-a: #3b82f6;
  --hero-b: #60a5fa;
  --hero-glow: rgba(59, 130, 246, 0.35);
  --cyber-glow-1: rgba(59, 130, 246, 0.15);
  --cyber-glow-2: rgba(96, 165, 250, 0.12);
}
[data-theme="dark"][data-class="9"] {
  --bg: #0a1424;
  --bg-2: #0f1e33;
  --surface: #161a26;
  --surface-2: #1c2130;
  --field: #1e2333;
  --border: #272d3d;
  --border-strong: #3a4155;
  --text: #eef1f8;
  --text-soft: #b4bccd;
  --text-muted: #7a8298;
  --brand: #60a5fa;
  --brand-soft: #3b82f6;
  --brand-tint: rgba(96, 165, 250, 0.14);
  --brand-glow: rgba(96, 165, 250, 0.26);
  --hero-a: #2563eb;
  --hero-b: #3b82f6;
  --hero-glow: rgba(59, 130, 246, 0.4);
}

/* ─── Class 10 — Purple ─── */
[data-class="10"] {
  --bg: #faf5ff;
  --bg-2: #f3e8ff;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --field: #f2f4f9;
  --border: #e4e7ef;
  --border-strong: #ccd2e0;
  --text: #131722;
  --text-soft: #4a5163;
  --text-muted: #8b93a7;
  --brand: #a855f7;
  --brand-soft: #c084fc;
  --brand-tint: rgba(168, 85, 247, 0.12);
  --brand-glow: rgba(168, 85, 247, 0.24);
  --hero-a: #a855f7;
  --hero-b: #c084fc;
  --hero-glow: rgba(168, 85, 247, 0.35);
  --cyber-glow-1: rgba(168, 85, 247, 0.15);
  --cyber-glow-2: rgba(192, 132, 252, 0.12);
}
[data-theme="dark"][data-class="10"] {
  --bg: #170a24;
  --bg-2: #210f33;
  --surface: #161a26;
  --surface-2: #1c2130;
  --field: #1e2333;
  --border: #272d3d;
  --border-strong: #3a4155;
  --text: #eef1f8;
  --text-soft: #b4bccd;
  --text-muted: #7a8298;
  --brand: #c084fc;
  --brand-soft: #a855f7;
  --brand-tint: rgba(192, 132, 252, 0.14);
  --brand-glow: rgba(192, 132, 252, 0.26);
  --hero-a: #9333ea;
  --hero-b: #a855f7;
  --hero-glow: rgba(168, 85, 247, 0.4);
}

/* Default dark (non-class-specific fallback) */
[data-theme="dark"]:not([data-class="8"]) {
  --surface: #161a26;
  --surface-2: #1c2130;
  --field: #1e2333;
  --border: #272d3d;
  --border-strong: #3a4155;
  --text: #eef1f8;
  --text-soft: #b4bccd;
  --text-muted: #7a8298;
  --ok-soft: rgba(16, 185, 129, 0.18);
  --err-soft: rgba(239, 68, 68, 0.18);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.5s ease, color 0.35s ease;
  position: relative;
}

/* Background wash */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(900px 700px at 10% 0%, var(--cyber-glow-1, var(--brand-tint)), transparent 60%),
    radial-gradient(800px 700px at 100% 100%, var(--cyber-glow-2, var(--brand-tint)), transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  transition: background 0.6s ease;
  pointer-events: none;
}

/* Very subtle neutral grid for Class 8 */
html[data-class="8"] body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 78%);
}

::selection { background: var(--brand-glow); color: #fff; }
html[data-class="8"] ::selection { color: #000; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: content-box;
}

/* ============================================================
   2. APP LAYOUT
   ============================================================ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 50;
  transition: background 0.4s ease, border-color 0.4s ease;
}

.sb-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
}

.sb-logo {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  box-shadow: 0 10px 22px -10px var(--brand);
  flex: 0 0 auto;
  transition: background 0.5s ease, box-shadow 0.5s ease;
  position: relative;
}
html[data-class="8"] .sb-logo { color: #000; }
.sb-logo svg { width: 21px; height: 21px; }
.sb-logo::after {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  opacity: 0;
  z-index: -1;
  filter: blur(10px);
  transition: opacity 0.4s ease;
}
html[data-class="8"] .sb-logo::after { opacity: 0.6; }

.sb-name {
  font-weight: 800;
  font-size: 1.06rem;
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.sb-name small {
  display: block;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 2px;
}

.class-switcher {
  display: flex;
  gap: 6px;
  padding: 10px 14px 12px;
  border-bottom: 1px solid var(--border);
}
.class-pill {
  flex: 1;
  padding: 8px 0;
  border-radius: 10px;
  font-size: 0.8rem;
  font-weight: 700;
  text-align: center;
  color: var(--text-soft);
  background: var(--field);
  border: 1px solid var(--border);
  transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease,
              box-shadow 0.25s ease;
}
.class-pill:hover { transform: translateY(-1px); border-color: var(--border-strong); }
.class-pill.on {
  color: #fff;
  background: var(--brand);
  border-color: var(--brand);
  box-shadow: 0 6px 14px -6px var(--brand);
}
html[data-class="8"] .class-pill.on { color: #000; }

.sb-nav {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-sec {
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 14px 12px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-soft);
  transition: background 0.18s ease, color 0.18s ease;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--field); color: var(--text); }
.nav-item.active { background: var(--brand-tint); color: var(--brand); }

.nav-item svg { width: 17px; height: 17px; flex: 0 0 auto; opacity: 0.9; }
.nav-item .new-badge {
  margin-left: auto;
  font-size: 0.6rem;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  color: #fff;
  letter-spacing: 0.03em;
  animation: pulseBadge 2.5s ease-in-out infinite;
}
html[data-class="8"] .nav-item .new-badge { color: #000; }
@keyframes pulseBadge {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.sb-foot {
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  font-size: 0.72rem;
  color: var(--text-muted);
  line-height: 1.6;
}
.sb-foot .name { color: var(--brand); font-weight: 800; }

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px clamp(16px, 3vw, 32px);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  transition: background 0.4s ease, border-color 0.4s ease;
}

.search {
  flex: 1;
  max-width: 380px;
  position: relative;
}
.search svg {
  position: absolute;
  left: 13px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}
.search input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  font-size: 0.88rem;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
}
.search input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-glow);
  background: var(--surface-2);
}

.lang-picker {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: 11px;
  background: var(--field);
  border: 1px solid var(--border);
}
.lang-btn {
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--text-soft);
  transition: background 0.15s ease, color 0.15s ease;
  letter-spacing: 0.02em;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.on {
  color: #fff;
  background: var(--brand);
}
html[data-class="8"] .lang-btn.on { color: #000; }

.tb-right {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-soft);
  background: var(--field);
  border: 1px solid var(--border);
}

.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 11px;
  color: var(--text-soft);
  background: var(--field);
  border: 1px solid var(--border);
  transition: transform 0.2s ease;
}
.icon-btn:hover { transform: translateY(-1px); }
.icon-btn svg { width: 18px; height: 18px; }

.icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: block; }
html[data-class="8"] .icon-sun { display: none; }
html[data-class="8"] .icon-moon { display: block; }

.content {
  flex: 1;
  padding: clamp(18px, 3vw, 34px) clamp(16px, 3vw, 32px) 60px;
  max-width: 1300px;
  width: 100%;
  margin: 0 auto;
}

/* ============================================================
   3. COMMON UI
   ============================================================ */
.page-head { margin-bottom: 22px; }
.page-head h1 {
  font-size: clamp(1.4rem, 3vw, 1.9rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.page-head p {
  margin-top: 6px;
  font-size: 0.92rem;
  color: var(--text-soft);
  line-height: 1.6;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.88rem;
  font-weight: 700;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: background 0.2s ease, transform 0.15s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }

.btn-primary {
  color: #fff;
  background: var(--brand);
  box-shadow: 0 6px 16px -6px var(--brand);
}
.btn-primary:hover { background: var(--brand-soft); }
html[data-class="8"] .btn-primary { color: #000; }

.btn-ghost {
  color: var(--text-soft);
  background: var(--field);
  border-color: var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

.btn-sm { padding: 8px 13px; font-size: 0.82rem; border-radius: 9px; }
.btn-block { width: 100%; }

/* ============================================================
   4. DASHBOARD
   ============================================================ */
.hero-card {
  position: relative;
  overflow: hidden;
  padding: clamp(20px, 3vw, 32px);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  color: #fff;
  box-shadow: 0 24px 50px -22px var(--hero-glow);
  margin-bottom: 24px;
  transition: background 0.6s ease, box-shadow 0.6s ease;
}
html[data-class="8"] .hero-card { color: #000; }
.hero-card::before {
  content: "";
  position: absolute;
  top: -60px; right: -40px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
}
.hero-card::after {
  content: "";
  position: absolute;
  bottom: -80px; right: 80px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.10);
}
html[data-class="8"] .hero-card::before { background: rgba(0, 0, 0, 0.12); }
html[data-class="8"] .hero-card::after { background: rgba(0, 0, 0, 0.08); }
.hero-inner { position: relative; z-index: 1; max-width: 620px; }

.hero-card .greet {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.9;
}
.hero-card h2 {
  margin-top: 8px;
  font-size: clamp(1.3rem, 3vw, 1.85rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.2;
}
.hero-card p {
  margin-top: 10px;
  font-size: 0.92rem;
  line-height: 1.6;
  opacity: 0.94;
}
.hero-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.hero-actions .btn {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.32);
}
.hero-actions .btn:hover { background: rgba(255, 255, 255, 0.28); }
.hero-actions .btn.solid {
  background: #fff;
  color: var(--brand);
  border-color: #fff;
}
html[data-class="8"] .hero-actions .btn {
  background: rgba(0, 0, 0, 0.14);
  border-color: rgba(0, 0, 0, 0.22);
  color: #000;
}
html[data-class="8"] .hero-actions .btn:hover { background: rgba(0, 0, 0, 0.22); }
html[data-class="8"] .hero-actions .btn.solid {
  background: #000;
  color: var(--brand);
  border-color: #000;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat {
  padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: transform 0.22s ease;
}
.stat:hover { transform: translateY(-3px); }
.stat .ic {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 11px;
  margin-bottom: 12px;
  color: var(--brand);
  background: var(--brand-tint);
  font-size: 1.1rem;
}
.stat .val {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat .lbl {
  margin-top: 5px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
}

/* ============================================================
   7. FLASHCARDS
   ============================================================ */
.fc-stage { max-width: 620px; margin: 0 auto; }

}

  flex-direction: column;

}

}

.fc-face .tag {

}

}

  padding: 18px;

/* ============================================================
   9. TIMER
   ============================================================ */

.timer-ring {

}

html[data-class="8"] .msg.user .av { color: #000; }
.msg.ai .av {
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  color: #fff;
  border-color: transparent;
}
html[data-class="8"] .msg.ai .av { color: #000; }
.msg .bubble {
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 0.9rem;
  line-height: 1.65;
  background: var(--field);
  border: 1px solid var(--border);
  color: var(--text);
}
.msg.user .bubble {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
html[data-class="8"] .msg.user .bubble { color: #000; }
.msg.ai .bubble {
  background: var(--brand-tint);
  border-color: var(--brand-glow);
}
.msg .bubble strong { font-weight: 750; }
.msg .bubble em { font-style: italic; opacity: 0.9; }
.msg .bubble code {
  font-family: ui-monospace, monospace;
  font-size: 0.84rem;
  background: rgba(255, 255, 255, 0.15);
  padding: 1px 6px;
  border-radius: 5px;
}
html[data-class="8"] .msg .bubble code { background: rgba(0, 0, 0, 0.2); }
.msg.ai .bubble code { background: var(--surface); color: var(--brand); font-weight: 700; }
.msg .bubble ul, .msg .bubble ol { margin: 6px 0 0 20px; }
.msg .bubble li { margin-bottom: 4px; }

.quick-asks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.quick-asks .chip { font-size: 0.8rem; padding: 8px 13px; }

.doubt-input { display: flex; gap: 10px; }
.doubt-input input {
  flex: 1;
  padding: 14px 18px;
  font-size: 0.92rem;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--border);
  border-radius: 14px;
  outline: none;
}
.doubt-input input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-glow);
  background: var(--surface);
}
.doubt-input .btn { padding: 14px 22px; border-radius: 14px; }

.ai-loading { display: inline-flex; align-items: center; gap: 5px; }
.ai-loading span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--brand);
  animation: aiBounce 1.2s infinite;
}
.ai-loading span:nth-child(2) { animation-delay: 0.15s; }
.ai-loading span:nth-child(3) { animation-delay: 0.3s; }
@keyframes aiBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

.mic-btn {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--field);
  border: 1px solid var(--border);
  color: var(--text-soft);
  transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  flex: 0 0 auto;
}
.mic-btn:hover { color: var(--text); border-color: var(--border-strong); }
.mic-btn.rec {
  background: var(--err);
  color: #fff;
  border-color: var(--err);
  animation: pulseRec 1.2s ease-in-out infinite;
}
@keyframes pulseRec {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
  50% { transform: scale(1.06); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
}
.mic-btn svg { width: 20px; height: 20px; }

.gen-card {
  padding: 20px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  transition: border-color 0.3s ease;
}
.gen-card h3 {
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.gen-card p {
  font-size: 0.84rem;
  color: var(--text-soft);
  margin-bottom: 14px;
  line-height: 1.55;
}
.gen-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.gen-row select, .gen-row input {
  padding: 10px 14px;
  font-size: 0.86rem;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  min-width: 140px;
}
.gen-row select:focus, .gen-row input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-glow);
}
.gen-output {
  margin-top: 14px;
  padding: 16px;
  border-radius: var(--radius-sm);
  background: var(--field);
  border: 1px solid var(--border);
  font-size: 0.88rem;
  line-height: 1.7;
  color: var(--text-soft);
  white-space: pre-wrap;
  display: none;
  font-family: ui-monospace, monospace;
}
.gen-output.show { display: block; }

/* ============================================================
   12. PROGRESS
   ============================================================ */
.prog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.prog-card {
  padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.prog-card h4 {
  font-size: 0.88rem;
  font-weight: 800;
  margin-bottom: 14px;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 11px;
  font-size: 0.82rem;
}
.bar-row .nm {
  width: 92px;
  font-weight: 700;
  color: var(--text-soft);
  flex: 0 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-row .track {
  flex: 1;
  height: 8px;
  border-radius: 999px;
  background: var(--field);
  overflow: hidden;
}
.bar-row .fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.7s ease;
}
.bar-row .pct {
  width: 38px;
  text-align: right;
  font-weight: 800;
  font-size: 0.78rem;
  color: var(--text-muted);
  flex: 0 0 auto;
}

.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.heat .day { aspect-ratio: 1; border-radius: 6px; background: var(--field); }
.heat .day.l1 { background: var(--brand-tint); }
.heat .day.l2 { background: var(--brand-glow); }
.heat .day.l3 { background: var(--brand-soft); }
.heat .day.l4 { background: var(--brand); }

/* ============================================================
   13. EMPTY STATE
   ============================================================ */
.empty {
  text-align: center;
  padding: 46px 24px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
}
.empty .em { font-size: 2.4rem; margin-bottom: 12px; }
.empty h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
.empty p {
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.6;
  max-width: 340px;
  margin: 0 auto;
}

/* ============================================================
   14. TOAST
   ============================================================ */
.toast-wrap {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 900;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: min(400px, calc(100% - 32px));
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 0.87rem;
  font-weight: 650;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.3s ease both;
}
.toast.hide { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }
.toast .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.toast.ok .dot { background: var(--ok); }
.toast.warn .dot { background: var(--warn); }
.toast.err .dot { background: var(--err); }

/* ============================================================
   15. RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .sidebar {
    width: 100%;
    flex: 0 0 auto;
    height: auto;
    position: sticky;
    top: 0;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .sb-brand { padding: 12px 16px; border-bottom: none; }
  .class-switcher { padding: 8px 14px 10px; border-bottom: none; }
  .sb-nav {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 10px 12px;
    gap: 6px;
    scrollbar-width: none;
  }
  .sb-nav::-webkit-scrollbar { display: none; }
  .nav-sec { display: none; }
  .nav-item {
    width: auto;
    flex: 0 0 auto;
    padding: 9px 14px;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .sb-foot { display: none; }
  .topbar { position: static; flex-wrap: wrap; }
  .search { max-width: none; order: 2; flex-basis: 100%; }
  .lang-picker { order: 1; }
  .tb-right { order: 1; }
}

@media (max-width: 640px) {
  .notes-wrap { grid-template-columns: 1fr; }
  .chapter-row { flex-wrap: wrap; }
  .chapter-row .acts { width: 100%; }
  .result-stats { gap: 18px; }
  .fc { min-height: 260px; }
  .timer-ring { width: 220px; height: 220px; }
  .timer-ring .time { font-size: 2.5rem; }
  .lang-picker { padding: 3px; }
  .lang-btn { padding: 5px 9px; font-size: 0.68rem; }
  .gen-row { flex-direction: column; align-items: stretch; }
  .gen-row select, .gen-row input, .gen-row button { width: 100%; }
}

  function loadProgress() {
    try {
      const raw = localStorage.getItem("sm-progress-v6");
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { chapters: {}, quizzes: [], streak: { count: 1, last: null }, activity: {} };
  }
  function saveProgress() {
    try { localStorage.setItem("sm-progress-v6", JSON.stringify(state.progress)); } catch (e) {}
  }
  function loadNotes() {
    try {
      const raw = localStorage.getItem("sm-notes-v6");
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [{ id: "n1", title: "Welcome to Notes ✏️", body: "Write down what you learn.\n\nTry the Pomodoro method:\n• 25 min focus\n• 5 min break", updated: Date.now() }];
  }
  function saveNotes() {
    try { localStorage.setItem("sm-notes-v6", JSON.stringify(state.notes)); } catch (e) {}
  }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function t(key) { return (STRINGS[state.lang] && STRINGS[state.lang][key]) || STRINGS.en[key] || key; }
  function subjects() { return CURRICULUM[state.classLevel] || CURRICULUM["8"]; }
  function findSubject(id) { return subjects().find(function (s) { return s.id === id; }); }
  function findChapter(subjId, chId) {
    const s = findSubject(subjId);
    return s ? s.chapters.find(function (c) { return c.id === chId; }) : null;
  }
  function formulas() { return FORMULAS[state.classLevel] || FORMULAS["8"]; }

  function toast(msg, kind) {
    kind = kind || "ok";
    const el = document.createElement("div");
    el.className = "toast " + kind;
    el.innerHTML = '<span class="dot"></span><span>' + esc(msg) + '</span>';
    $("toasts").appendChild(el);
    setTimeout(function () {
      el.classList.add("hide");
      setTimeout(function () { el.remove(); }, 320);
    }, 2400);
  }

  function updateStreak() {
    const today = new Date().toDateString();
    const st = state.progress.streak;
    if (st.last === today) return;
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (st.last === yesterday) st.count += 1;
    else st.count = 1;
    st.last = today;
    saveProgress();
  }

  function markActivity() {
    const key = new Date().toISOString().slice(0, 10);
    state.progress.activity[key] = (state.progress.activity[key] || 0) + 1;
    saveProgress();
  }

  function chapterProgress(subjId, chId) {
    const rec = state.progress.chapters[state.classLevel + ":" + subjId + ":" + chId];
    if (!rec) return 0;
    return Math.min(1, (rec.best || 0) / 100);
  }
  function subjectProgress(subjId) {
    const s = findSubject(subjId);
    if (!s || !s.chapters.length) return 0;
    let sum = 0;
    s.chapters.forEach(function (c) { sum += chapterProgress(subjId, c.id); });
    return sum / s.chapters.length;
  }

  function applyTheme(th) {
    document.documentElement.setAttribute("data-theme", th);
    try { localStorage.setItem("sm-theme", th); } catch (e) {}
  }
  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("sm-theme"); } catch (e) {}
    if (saved === "dark" || saved === "light") applyTheme(saved);
    else {
      const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(dark ? "dark" : "light");
    }
  })();

  $("themeToggle").addEventListener("click", function () {
    if (state.classLevel === "8") {
      toast("Class 8 is locked to Black 🌑", "warn");
      return;
    }
    const now = document.documentElement.getAttribute("data-theme");
    applyTheme(now === "dark" ? "light" : "dark");
  });

  function applyClass(level) {
    if (!CURRICULUM[level]) level = "8";
    state.classLevel = level;
    state.subjectId = null;
    state.quiz = null;
    state.fc = null;

    document.documentElement.setAttribute("data-class", level);

    document.querySelectorAll(".class-pill").forEach(function (p) {
      p.classList.toggle("on", p.getAttribute("data-class") === level);
    });

    const label = level === "8" ? "Class 8 · Black" : "Class " + level + " · Smart Learning";
    $("sbClassLabel").textContent = label;
    try { localStorage.setItem("sm-class", level); } catch (e) {}

    render();
  }

  document.querySelectorAll(".class-pill").forEach(function (p) {
    p.addEventListener("click", function () {
      applyClass(p.getAttribute("data-class"));
    });
  });

  function applyLang(lang) {
    if (!STRINGS[lang]) lang = "en";
    state.lang = lang;
    document.querySelectorAll(".lang-btn").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-lang") === lang);
    });
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    try { localStorage.setItem("sm-lang", lang); } catch (e) {}

    const si = $("searchInput");
    if (si) si.placeholder = t("searchPlaceholder");

    render();

  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.addEventListener("click", function () {

    let c = null, l = null;

    if (c && CURRICULUM[c]) {
      state.classLevel = c;
      document.documentElement.setAttribute("data-class", c);
      document.querySelectorAll(".class-pill").forEach(function (p) {
        p.classList.toggle("on", p.getAttribute("data-class") === c);
      });
      const label = c === "8" ? "Class 8 · Black" : "Class " + c + " · Smart Learning";
      $("sbClassLabel").textContent = label;
    } else {
      document.documentElement.setAttribute("data-class", "8");
    }
    if (l && STRINGS[l]) {
      state.lang = l;
      document.querySelectorAll(".lang-btn").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-lang") === l);
      });
      document.documentElement.setAttribute("lang", l);
      document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");

  function setView(view, opts) {
    opts = opts || {};
    state.view = view;
    if (opts.subjectId !== undefined) state.subjectId = opts.subjectId;

    document.querySelectorAll(".nav-item").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === view);
    });

    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.querySelectorAll(".nav-item").forEach(function (btn) {
    btn.addEventListener("click", function () {
      setView(btn.getAttribute("data-view"));
    });
  });

  const view = $("view");

  function render() {
    switch (state.view) {
      case "dashboard":  renderDashboard(); break;
      case "subjects":   state.subjectId ? renderSubjectDetail(state.subjectId) : renderSubjects(); break;
      case "quiz":       renderQuiz(); break;
      case "flashcards": renderFlashcards(); break;
      case "formulas":   renderFormulas(); break;
      case "doubt":      renderDoubt(); break;
      case "timer":      renderTimer(); break;
      case "notes":      renderNotes(); break;
      case "progress":   renderProgress(); break;
      default:           renderDashboard();
    }
  }

  function renderDashboard() {
    const hour = new Date().getHours();
    const part = hour < 12 ? t("morning") : hour < 17 ? t("afternoon") : t("evening");
    const subs = subjects();

    let totalChapters = 0, doneChapters = 0, totalQ = 0;
    subs.forEach(function (s) {
      s.chapters.forEach(function (c) {
        totalChapters++;
        totalQ += c.q.length;
        if (chapterProgress(s.id, c.id) >= 0.6) doneChapters++;
      });
    });
    const bestPct = computeOverallBest();
    const recent = state.progress.quizzes.filter(function (q) {
      return !q.classLevel || q.classLevel === state.classLevel;
    }).slice(-1)[0];

    let html = "";
    html += '<div class="hero-card">';
    html +=   '<div class="hero-inner">';
    html +=     '<div class="greet">' + esc(t("greet")) + ', ' + esc(part) + ' · Class ' + state.classLevel + '</div>';
    html +=     '<h2>' + esc(t("heroTitle")) + '</h2>';
    html +=     '<p>' + esc(t("heroDesc")) + '</p>';
    html +=     '<div class="hero-actions">';
    html +=       '<button class="btn solid" data-action="dash-doubt">🤖 ' + esc(t("doubtSolver")) + '</button>';
    html +=       '<button class="btn" data-action="dash-quiz">' + esc(t("startQuiz")) + '</button>';
    html +=       '<button class="btn" data-action="dash-fc">' + esc(t("flashcards")) + '</button>';
    html +=     '</div>';
    html +=   '</div>';
    html += '</div>';

    html += '<div class="stat-grid">';
    html += statCard("📚", totalChapters, t("chapters"));
    html += statCard("✅", doneChapters, t("completed"));
    html += statCard("❓", totalQ, t("quizQuestions"));
    html += statCard("🏆", bestPct + "%", t("bestScore"));
    html += '</div>';

    html += '<div class="section-head"><h3>' + esc(t("yourSubjects")) + '</h3><a class="link" data-action="all-subjects">' + esc(t("viewAll")) + '</a></div>';
    html += '<div class="subject-grid">';
    subs.forEach(function (s) { html += subjectCardHTML(s); });
    html += '</div>';

    if (recent) {
      html += '<div class="section-head"><h3>' + esc(t("lastQuiz")) + '</h3></div>';
      html += '<div class="card" style="padding:18px;">';
      html +=   '<div style="font-size:0.85rem;font-weight:700;color:var(--text-soft);">' + esc(recent.subjectName) + ' · ' + esc(recent.chapterName) + '</div>';
      html +=   '<div style="margin-top:8px;font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;">' + recent.score + '%</div>';
      html +=   '<div style="margin-top:4px;font-size:0.82rem;color:var(--text-muted);">' + recent.correct + ' / ' + recent.total + ' ' + esc(t("correct")) + '</div>';
      html += '</div>';
    }

    view.innerHTML = html;

    view.querySelectorAll("[data-action]").forEach(function (b) {
      b.addEventListener("click", function () {
        const a = b.getAttribute("data-action");
        if (a === "dash-quiz") setView("quiz");
        else if (a === "dash-fc") setView("flashcards");
        else if (a === "dash-doubt") setView("doubt");
        else if (a === "all-subjects") setView("subjects");
      });
    });
    view.querySelectorAll("[data-subject]").forEach(function (b) {
      b.addEventListener("click", function () {
        setView("subjects", { subjectId: b.getAttribute("data-subject") });
      });
    });
  }

  function statCard(emoji, value, label) {
    return '<div class="stat">'
      + '<div class="ic">' + emoji + '</div>'
      + '<div class="val">' + esc(String(value)) + '</div>'
      + '<div class="lbl">' + esc(label) + '</div>'
      + '</div>';
  }

  function subjectCardHTML(s) {
    const pct = Math.round(subjectProgress(s.id) * 100);
    return '<button class="subj-card ' + s.cls + '" data-subject="' + s.id + '">'
      + '<div class="em">' + s.emoji + '</div>'
      + '<div class="nm">' + esc(s.name) + '</div>'
      + '<div class="meta">' + s.chapters.length + ' ' + esc(t("chapters")) + ' · ' + esc(s.desc) + '</div>'
      + '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div>'
      + '</button>';
  }

  function computeOverallBest() {
    const qs = state.progress.quizzes.filter(function (q) {
      return !q.classLevel || q.classLevel === state.classLevel;
    });
    if (!qs.length) return 0;
    let best = 0;
    qs.forEach(function (q) { if (q.score > best) best = q.score; });
    return Math.round(best);
  }

  function renderSubjects() {
    let html = '<div class="page-head"><h1>' + esc(t("subjects")) + '</h1><p>' + esc(t("subjectsDesc")) + '</p></div>';

    subjects().forEach(function (s) { html += subjectCardHTML(s); });
    html += '</div>';
    view.innerHTML = html;

    view.querySelectorAll("[data-subject]").forEach(function (b) {
      b.addEventListener("click", function () {
        setView("subjects", { subjectId: b.getAttribute("data-subject") });
      });
    });
  }

  function startQuiz(subjId, chId, length) {
    const s = findSubject(subjId);
    const c = findChapter(subjId, chId);
    if (!s || !c) return;

    const n = length || c.q.length;
    let pool = c.q.slice();
    shuffle(pool);
    const questions = pool.slice(0, Math.min(n, pool.length));

    state.quiz = {
      active: true, finished: false,
      subjectId: subjId, chapterId: chId,
      subjectName: s.name, chapterName: c.name,
      questions: questions,
      index: 0, score: 0,
      answers: [], revealed: false
    };

    setView("quiz");
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
  }

  function renderQuizActive() {
    const q = state.quiz;
    if (!q || !q.active) return;
    const total = q.questions.length;
    const cur = q.questions[q.index];
    if (!cur) return;

    const pct = (q.index / total) * 100;
    const letters = ["A", "B", "C", "D"];

    let html = '<div class="quiz-shell">';
    html +=   '<div class="quiz-top">';
    html +=     '<div class="info">' + esc(q.subjectName) + ' <span class="sub">· ' + esc(q.chapterName) + '</span></div>';
    html +=     '<div class="info">' + esc(t("question")) + ' ' + (q.index + 1) + ' / ' + total + '</div>';
    html +=   '</div>';
    html +=   '<div class="qbar"><div class="qbar-fill" style="width:' + pct + '%"></div></div>';

    html +=   '<div class="qcard">';
    html +=     '<div class="qnum">' + esc(t("question")) + ' ' + (q.index + 1) + '</div>';
    html +=     '<div class="qtext">' + esc(cur.q) + '</div>';

    cur.o.forEach(function (opt, i) {
      let cls = "opt", mark = "";
      if (q.revealed) {
        cls += " locked";
        if (i === cur.a) { cls += " correct"; mark = "✓"; }
        else if (q.answers[q.index] === i) { cls += " wrong"; mark = "✗"; }
        else { cls += " dim"; }
      }
      html += '<button type="button" class="' + cls + '" data-opt="' + i + '" data-qindex="' + q.index + '">';
      html +=   '<span class="letter">' + letters[i] + '</span>';
      html +=   '<span class="opt-text">' + esc(opt) + '</span>';
      html +=   '<span class="mark">' + mark + '</span>';
      html += '</button>';
    });

    if (q.revealed) {
      if (cur.e) {
        html += '<div class="explain-box">';
        html +=   '<div class="ex-title">' + esc(t("whyCorrect")) + '</div>';
        html +=   esc(cur.e);
        html += '</div>';
      } else if (cur.h) {
        html += '<div class="hint-box"><strong>' + esc(t("hintLabel")) + '</strong> ' + esc(cur.h) + '</div>';
      }
    }

    html +=   '</div>';

    html +=   '<div class="quiz-foot">';
    if (!q.revealed) {
      html += '<button class="btn btn-ghost" id="qHint">' + esc(t("showHint")) + '</button>';
      html += '<button class="btn btn-ghost" id="qReveal">' + esc(t("revealAnswer")) + '</button>';
    } else {
      if (q.index < total - 1) {
        html += '<button class="btn btn-primary" id="qNext">' + esc(t("nextQuestion")) + '</button>';
      } else {
        html += '<button class="btn btn-primary" id="qFinish">' + esc(t("seeResults")) + '</button>';
      }
    }
    html +=   '</div>';
    html += '</div>';

    view.innerHTML = html;

    view.querySelectorAll(".opt").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (!state.quiz || !state.quiz.active || state.quiz.revealed) return;
        const btnQIndex = parseInt(btn.getAttribute("data-qindex"), 10);
        if (btnQIndex !== state.quiz.index) return;
        handleAnswer(parseInt(btn.getAttribute("data-opt"), 10));
      });
    });

    const hintBtn = view.querySelector("#qHint");
    if (hintBtn) hintBtn.addEventListener("click", function () {
      const c = state.quiz.questions[state.quiz.index];
      if (c.h) toast(c.h, "warn");
      else toast("No hint for this one!", "warn");
    });

    const revealBtn = view.querySelector("#qReveal");
    if (revealBtn) revealBtn.addEventListener("click", function () {
      if (!state.quiz || state.quiz.revealed) return;
      state.quiz.answers[state.quiz.index] = -1;
      state.quiz.revealed = true;
      renderQuizActive();
    });

    const nextBtn = view.querySelector("#qNext");
    if (nextBtn) nextBtn.addEventListener("click", function () {
      state.quiz.index++;
      state.quiz.revealed = false;
      renderQuizActive();
    });
    const finBtn = view.querySelector("#qFinish");
    if (finBtn) finBtn.addEventListener("click", finishQuiz);
  }

  function handleAnswer(chosen) {
    const q = state.quiz;
    if (!q || !q.active || q.revealed) return;
    const cur = q.questions[q.index];
    if (!cur) return;

    q.answers[q.index] = chosen;
    q.revealed = true;

    if (chosen === cur.a) { q.score++; toast("Correct! 🎉", "ok"); }
    else if (chosen >= 0) toast("Not quite — correct answer highlighted.", "warn");

    renderQuizActive();
  }

  function finishQuiz() {
    const q = state.quiz;
    if (!q) return;
    const total = q.questions.length;
    const correct = q.score;
    const pct = Math.round((correct / total) * 100);

    state.progress.quizzes.push({
      classLevel: state.classLevel,
      subjectId: q.subjectId, subjectName: q.subjectName,
      chapterId: q.chapterId, chapterName: q.chapterName,
      score: pct, correct: correct, total: total,
      date: Date.now()
    });
    if (state.progress.quizzes.length > 80) state.progress.quizzes = state.progress.quizzes.slice(-80);

    const key = state.classLevel + ":" + q.subjectId + ":" + q.chapterId;
    const prev = state.progress.chapters[key] || { best: 0, attempts: 0 };
    state.progress.chapters[key] = {
      best: Math.max(prev.best || 0, pct),
      attempts: (prev.attempts || 0) + 1,
      last: pct
    };
    saveProgress();
    markActivity();

    q.active = false;
    q.finished = true;
    q.finalScore = pct;

    toast(pct >= 60 ? "Great job! 🎉" : "Keep practising! 💪", pct >= 60 ? "ok" : "warn");
    renderQuizResult();
  }

  function renderQuizResult() {
    const q = state.quiz;
    if (!q) return;
    const pct = q.finalScore;
    const total = q.questions.length;
    const correct = q.score;

    let msg;
    if (pct >= 90) msg = "Outstanding! You've mastered this chapter. 🌟";
    else if (pct >= 75) msg = "Excellent work! A little polish and you're perfect.";
    else if (pct >= 50) msg = "Good effort! Review the wrong answers and try again.";
    else msg = "Don't worry — every attempt makes you stronger.";

    let html = '<div class="quiz-shell">';
    html += '<div class="result-card">';
    html +=   '<div class="result-ring" style="--pct:' + pct + '%">';
    html +=     '<div class="score">' + pct + '<small>%</small></div>';
    html +=   '</div>';
    html +=   '<h2>' + esc(pct >= 60 ? t("wellDone") : t("keepGoing")) + '</h2>';
    html +=   '<p class="msg">' + msg + '</p>';
    html +=   '<div class="result-stats">';
    html +=     '<div class="rs"><div class="v">' + correct + '</div><div class="l">' + esc(t("correct")) + '</div></div>';
    html +=     '<div class="rs"><div class="v">' + (total - correct) + '</div><div class="l">' + esc(t("wrong")) + '</div></div>';
    html +=     '<div class="rs"><div class="v">' + total + '</div><div class="l">' + esc(t("total")) + '</div></div>';
    html +=   '</div>';

    html += '<div class="review-list">';
    html +=   '<div class="qs-label" style="margin-bottom:10px;">' + esc(t("review")) + '</div>';
    q.questions.forEach(function (cur, i) {
      const chosen = q.answers[i];
      const isCorrect = chosen === cur.a;
      html += '<div class="review-item">';
      html +=   '<div class="rq">' + (i + 1) + '. ' + esc(cur.q) + '</div>';
      if (isCorrect) {
        html += '<div>✓ <span class="ra">' + esc(cur.o[cur.a]) + '</span></div>';
      } else if (chosen === -1 || chosen === undefined) {
        html += '<div>— · ' + esc(t("correct")) + ': <span class="ra">' + esc(cur.o[cur.a]) + '</span></div>';
      } else {
        html += '<div>✗ <span class="rw">' + esc(cur.o[chosen]) + '</span> · ' + esc(t("correct")) + ': <span class="ra">' + esc(cur.o[cur.a]) + '</span></div>';
      }
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="quiz-foot" style="justify-content:center;margin-top:26px;">';
    html +=   '<button class="btn btn-primary" id="qRetry">' + esc(t("tryAgain")) + '</button>';
    html +=   '<button class="btn btn-ghost" id="qAnother">' + esc(t("newQuiz")) + '</button>';
    html += '</div>';
    html += '</div></div>';

    view.innerHTML = html;

    view.querySelector("#qRetry").addEventListener("click", function () {
      const sid = q.subjectId, cid = q.chapterId;
      state.quiz = null;
      startQuiz(sid, cid);
    });
    view.querySelector("#qAnother").addEventListener("click", function () {
      state.quiz = null;
      setView("quiz");
    });
  }

  function startFlashcards(subjId, chId) {
    const s = findSubject(subjId);
    if (!s) return;
    let cards = [];
    if (chId) {
      const c = findChapter(subjId, chId);
      if (c) cards = c.c.slice();
    } else {
      s.chapters.forEach(function (c) { cards = cards.concat(c.c); });
    }
    if (!cards.length) { toast("No flashcards for this yet.", "warn"); return; }
    shuffle(cards);
    state.fc = { active: true, subjectId: subjId, subjectName: s.name, cards: cards, index: 0, flipped: false };
    setView("flashcards");
  }

    html +=     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>';
    html +=   '</button>';
    html +=   '<button class="btn btn-primary" id="doubtSend">' + esc(t("send")) + '</button>';
    html += '</div>';

    html += '</div>';
    view.innerHTML = html;

    const genSubject = view.querySelector("#genSubject");
    const genChapter = view.querySelector("#genChapter");
    subjects().forEach(function (s) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.emoji + " " + s.name;
      genSubject.appendChild(opt);
    });
    function populateChapters() {
      const sid = genSubject.value;
      genChapter.innerHTML = "";
      const s = findSubject(sid);
      if (!s) return;
      s.chapters.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        genChapter.appendChild(opt);
      });
    }
    populateChapters();
    genSubject.addEventListener("change", populateChapters);

    view.querySelectorAll(".ai-feature").forEach(function (card) {
      card.addEventListener("click", function () {
        sendMessage(card.getAttribute("data-prompt"));
      });
    });

    const chatBox = view.querySelector("#doubtChat");
    const input = view.querySelector("#doubtInput");

    if (state.doubtHistory.length) {
      state.doubtHistory.forEach(function (m) { appendMsg(m.who, m.text, true); });
    } else {
      appendMsg("ai", t("doubtGreeting"));
    }
    chatBox.scrollTop = chatBox.scrollHeight;

    function appendMsg(who, text, skipHistory) {
      const el = document.createElement("div");
      el.className = "msg " + who;
      const avatar = who === "user" ? "🧑" : "✨";
      el.innerHTML = '<div class="av">' + avatar + '</div><div class="bubble">' + formatChat(text) + '</div>';
      chatBox.appendChild(el);
      if (!skipHistory) state.doubtHistory.push({ who: who, text: text });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "msg ai";
      el.innerHTML = '<div class="av">✨</div><div class="bubble"><span class="ai-loading"><span></span><span></span><span></span></span> ' + esc(t("thinking")) + '…</div>';
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
      return el;
    }

    function formatChat(text) {
      let s = esc(text);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\n/g, "<br>");
      s = s.replace(/([•\-]) /g, "<br>• ");
      return s;
    }

    function sendMessage(text) {
      text = (text || input.value).trim();
      if (!text) return;
      if (text === "generate set") {
        const gc = view.querySelector("#genCard");
        gc.scrollIntoView({ behavior: "smooth", block: "center" });
        gc.style.borderColor = "var(--brand)";
        setTimeout(function () { gc.style.borderColor = ""; }, 1500);
        input.value = "";
        return;
      }
      appendMsg("user", text);
      input.value = "";
      const typing = showTyping();
      setTimeout(function () {
        typing.remove();
        const reply = aiAnswer(text);
        appendMsg("ai", reply);
      }, 480);
    }

    view.querySelector("#doubtSend").addEventListener("click", function () { sendMessage(); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") sendMessage(); });

    view.querySelectorAll("#quickAsks .chip").forEach(function (b) {
      b.addEventListener("click", function () { sendMessage(b.getAttribute("data-ask")); });
    });

    const micBtn = view.querySelector("#micBtn");
    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.lang = state.lang === "ml" ? "ml-IN" : state.lang === "ar" ? "ar-SA" : "en-IN";
      rec.continuous = false;
      rec.interimResults = false;
      rec.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        sendMessage();
      };
      rec.onend = function () { micBtn.classList.remove("rec"); };
      rec.onerror = function () { micBtn.classList.remove("rec"); };
      micBtn.addEventListener("click", function () {
        if (micBtn.classList.contains("rec")) { rec.stop(); return; }
        micBtn.classList.add("rec");
        try { rec.start(); } catch (e) { micBtn.classList.remove("rec"); }
      });
    } else {
      micBtn.addEventListener("click", function () {
        toast("Voice input not supported in this browser.", "warn");
      });
    }

    view.querySelector("#genBtn").addEventListener("click", function () {
      const sid = genSubject.value;
      const cid = genChapter.value;
      const count = parseInt(view.querySelector("#genCount").value, 10);
      const s = findSubject(sid);
      const c = findChapter(sid, cid);
      if (!s || !c) return;

      let pool = c.q.slice();
      shuffle(pool);
      const chosen = pool.slice(0, Math.min(count, pool.length));

      const out = view.querySelector("#genOutput");
      let txt = "📊 Study Set — " + s.name + " · " + c.name + "\n\n";
      chosen.forEach(function (q, i) {
        txt += (i + 1) + ". " + q.q + "\n";
        q.o.forEach(function (o, j) {
          txt += "   " + String.fromCharCode(65 + j) + ". " + o + "\n";
        });
        txt += "   ✅ Answer: " + String.fromCharCode(65 + q.a) + ". " + q.o[q.a] + "\n\n";
      });
      out.textContent = txt;
      out.classList.add("show");
      toast("Study set generated!", "ok");
    });
  }

  function aiFeatureCard(emoji, name, desc, prompt) {
    return '<button class="ai-feature" data-prompt="' + esc(prompt) + '">'
      + '<div class="fic">' + emoji + '</div>'
      + '<div class="fnm">' + esc(name) + '</div>'
      + '<div class="fds">' + esc(desc) + '</div>'
      + '</button>';
  }

  function langName(l) {
    return { en: "English", ml: "മലയാളം", ar: "العربية" }[l] || "English";
  }

  function aiAnswer(query) {
    const lower = query.toLowerCase();
    const lang = state.lang;

    if (/generate set|study set|practice set/.test(lower)) {
      return "📊 **To generate a study set:**\n\nScroll up and use the **Study Set Generator** card. Pick a subject, chapter, and how many questions you want!";
    }

    if (/^explain\s+/.test(lower)) {
      const topic = lower.replace(/^explain\s+/, "").trim();
      const found = findKB(topic);
      if (found) return found[lang] || found.en;
    }

    if (/formula/.test(lower)) {
      return "📐 **Key formulas for Class " + state.classLevel + ":**\n\nGo to the **Formulas** tab in the sidebar to see all formulas with examples.";
    }

    if (/solve|problem|homework/.test(lower)) {
      return "🧮 **I'd love to help solve that!**\n\nPlease type the **full problem**, e.g.:\n• \"Solve 2x + 5 = 15\"\n• \"Find HCF of 12 and 18\"";
    }

    if (/^(hi|hello|hey|namaste|ഹായ്|ഹലോ|مرحبا|السلام)/i.test(lower)) {
      return t("greeting");
    }
    if (/(thank|thanks|നന്ദി|شكرا)/i.test(lower)) {
      return t("thanks");
    }
    if (/^(help|what can you|how do i use|സഹായം|مساعدة)/i.test(lower)) {
      return t("helpMsg");
    }

    const found = findKB(lower);
    if (found) return found[lang] || found.en;

    const subs = subjects();
    for (let i = 0; i < subs.length; i++) {
      const s = subs[i];
      for (let j = 0; j < s.chapters.length; j++) {
        const c = s.chapters[j];
        for (let k = 0; k < c.q.length; k++) {
          const cur = c.q[k];
          const qLower = cur.q.toLowerCase();
          const words = lower.split(/\s+/).filter(function (w) { return w.length > 3; });
          let matchCount = 0;
          words.forEach(function (w) {
            if (qLower.indexOf(w) !== -1) matchCount++;
          });
          if (words.length > 0 && matchCount / words.length >= 0.5) {
            return "**" + cur.q + "**\n\n✅ **Answer:** " + cur.o[cur.a] + "\n\n💡 " + (cur.e || cur.h || "");
          }
        }
      }
    }

    return t("noMatch");
  }

  function findKB(query) {
    let best = null, bestScore = 0;
    for (let i = 0; i < KB.length; i++) {
      const entry = KB[i];
      let score = 0;
      for (let j = 0; j < entry.keys.length; j++) {
        const k = entry.keys[j].toLowerCase();
        if (query.indexOf(k) !== -1) score += k.length;
      }
      if (score > bestScore) {
        bestScore = score;
        best = entry;
      }
    }
    return bestScore > 0 ? best : null;
  }

  function renderTimer() {
    const tm = state.timer;
    const pct = 100 - (tm.seconds / tm.total) * 100;

    let html = '<div class="page-head" style="text-align:center;"><h1>' + esc(t("studyTimer")) + '</h1><p>' + esc(t("studyTimerDesc")) + '</p></div>';
    html += '<div class="timer-stage">';

    html += '<div class="timer-modes">';
    html +=   '<button class="chip' + (tm.mode === "focus" ? " on" : "") + '" data-mode="focus">' + esc(t("focus")) + ' · 25m</button>';
    html +=   '<button class="chip' + (tm.mode === "short" ? " on" : "") + '" data-mode="short">' + esc(t("break")) + ' · 5m</button>';
    html +=   '<button class="chip' + (tm.mode === "long" ? " on" : "") + '" data-mode="long">' + esc(t("longBreak")) + ' · 15m</button>';
    html += '</div>';

    html += '<div class="timer-ring" style="--tpct:' + pct + '%">';
    html +=   '<div class="display">';
    html +=     '<div class="time">' + pad(Math.floor(tm.seconds / 60)) + ':' + pad(tm.seconds % 60) + '</div>';
    html +=     '<div class="mode">' + esc(tm.mode === "focus" ? t("focus") : t("break")) + '</div>';
    html +=   '</div>';
    html += '</div>';

    html += '<div class="timer-controls">';
    html +=   '<button class="btn btn-primary" id="tPlay">' + esc(tm.running ? t("pause") : t("start")) + '</button>';
    html +=   '<button class="btn btn-ghost" id="tReset">' + esc(t("reset")) + '</button>';
    html += '</div>';

    html += '<div class="timer-session">' + esc(t("sessions")) + ' <strong>' + tm.sessions + '</strong></div>';
    html += '</div>';

    view.innerHTML = html;

    view.querySelectorAll("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () { setTimerMode(b.getAttribute("data-mode")); });
    });
    view.querySelector("#tPlay").addEventListener("click", toggleTimer);
    view.querySelector("#tReset").addEventListener("click", resetTimer);
  }

  function setTimerMode(mode) {
    const tm = state.timer;
    tm.running = false;
    if (tm.interval) { clearInterval(tm.interval); tm.interval = null; }
    tm.mode = mode;
    if (mode === "focus") tm.total = 25 * 60;
    else if (mode === "short") tm.total = 5 * 60;
    else tm.total = 15 * 60;
    tm.seconds = tm.total;
    renderTimer();
  }

  function toggleTimer() {
    const tm = state.timer;
    if (tm.running) {
      tm.running = false;
      if (tm.interval) { clearInterval(tm.interval); tm.interval = null; }
      renderTimer();
      return;
    }
    tm.running = true;
    tm.interval = setInterval(function () {
      tm.seconds--;
      if (tm.seconds <= 0) {
        clearInterval(tm.interval);
        tm.interval = null;
        tm.running = false;
        if (tm.mode === "focus") tm.sessions++;
        toast(tm.mode === "focus" ? "Focus session done! 🎉" : "Break over!", "ok");
        try {
          if (window.AudioContext || window.webkitAudioContext) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = 660;
            g.gain.value = 0.08;
            o.start();
            setTimeout(function () { o.stop(); }, 260);
          }
        } catch (e) {}
        tm.seconds = tm.total;
        renderTimer();
        return;
      }
      const ring = view.querySelector(".timer-ring");
      const timeEl = view.querySelector(".time");
      if (timeEl) timeEl.textContent = pad(Math.floor(tm.seconds / 60)) + ":" + pad(tm.seconds % 60);
      if (ring) ring.style.setProperty("--tpct", (100 - (tm.seconds / tm.total) * 100) + "%");
    }, 1000);
    renderTimer();
  }

  function resetTimer() {
    const tm = state.timer;
    tm.running = false;
    if (tm.interval) { clearInterval(tm.interval); tm.interval = null; }
    tm.seconds = tm.total;
    renderTimer();
  }

  function renderNotes() {
    if (!state.notes.length) state.notes = loadNotes();
    if (!state.activeNoteId && state.notes.length) state.activeNoteId = state.notes[0].id;
    const active = state.notes.find(function (n) { return n.id === state.activeNoteId; });

    let html = '<div class="page-head"><h1>' + esc(t("myNotes")) + '</h1><p>' + esc(t("myNotesDesc")) + '</p></div>';
    html += '<div class="notes-wrap">';

    html += '<div>';
    html +=   '<button class="btn btn-primary btn-block" id="noteNew" style="margin-bottom:10px;">' + esc(t("newNote")) + '</button>';
    html +=   '<div class="notes-list">';
    state.notes.forEach(function (n) {
      html += '<button class="note-item' + (n.id === state.activeNoteId ? " on" : "") + '" data-note="' + n.id + '">';
      html +=   '<div class="nt">' + esc(n.title || "Untitled") + '</div>';
      html +=   '<div class="nd">' + new Date(n.updated).toLocaleDateString() + '</div>';
      html += '</button>';
    });
    html +=   '</div>';
    html += '</div>';

    html += '<div class="note-editor">';
    if (active) {
      html += '<input type="text" id="noteTitle" placeholder="Note title…" value="' + esc(active.title) + '" />';
      html += '<textarea id="noteBody" placeholder="Start writing…">' + esc(active.body) + '</textarea>';
      html += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">';
      html +=   '<button class="btn btn-primary" id="noteSave">' + esc(t("save")) + '</button>';
      html +=   '<button class="btn btn-ghost" id="noteDelete">' + esc(t("delete")) + '</button>';
      html += '</div>';
    } else {
      html += '<div class="empty"><div class="em">📝</div><h3>' + esc(t("noNotes")) + '</h3><p>' + esc(t("noNotesDesc")) + '</p></div>';
    }
    html += '</div>';
    html += '</div>';

    view.innerHTML = html;

    const newBtn = view.querySelector("#noteNew");
    if (newBtn) newBtn.addEventListener("click", function () {
      const id = "n" + Date.now();
      state.notes.unshift({ id: id, title: "New Note", body: "", updated: Date.now() });
      state.activeNoteId = id;
      saveNotes();
      renderNotes();
      setTimeout(function () {
        const tt = view.querySelector("#noteTitle");
        if (tt) { tt.focus(); tt.select(); }
      }, 40);
    });

    view.querySelectorAll("[data-note]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.activeNoteId = b.getAttribute("data-note");
        renderNotes();
      });
    });

    const saveBtn = view.querySelector("#noteSave");
    if (saveBtn) saveBtn.addEventListener("click", function () {
      const tt = view.querySelector("#noteTitle").value.trim() || "Untitled";
      const bb = view.querySelector("#noteBody").value;
      const note = state.notes.find(function (n) { return n.id === state.activeNoteId; });
      if (note) {
        note.title = tt; note.body = bb; note.updated = Date.now();
        saveNotes();
        toast("Note saved ✓", "ok");
        renderNotes();
      }
    });

    const delBtn = view.querySelector("#noteDelete");
    if (delBtn) delBtn.addEventListener("click", function () {
      if (!confirm("Delete this note?")) return;
      state.notes = state.notes.filter(function (n) { return n.id !== state.activeNoteId; });
      state.activeNoteId = state.notes.length ? state.notes[0].id : null;
      saveNotes();
      renderNotes();
      toast("Note deleted", "warn");
    });
  }

  function renderProgress() {
    const subs = subjects();
    const subjectStats = subs.map(function (s) {
      return { id: s.id, name: s.name, emoji: s.emoji, pct: Math.round(subjectProgress(s.id) * 100) };
    });

    const avg = subjectStats.length
      ? Math.round(subjectStats.reduce(function (a, b) { return a + b.pct; }, 0) / subjectStats.length)
      : 0;

    const classQuizzes = state.progress.quizzes.filter(function (q) {
      return !q.classLevel || q.classLevel === state.classLevel;
    });
    const quizCount = classQuizzes.length;

    const days = [];
    const today = new Date();
    for (let i = 27; i >= 0; i--) {
      const d = new Date(today.getTime() - i * 86400000);
      const key = d.toISOString().slice(0, 10);
      days.push(state.progress.activity[key] || 0);
    }

    let html = '<div class="page-head"><h1>' + esc(t("progress")) + '</h1><p>' + esc(t("progressDesc")) + '</p></div>';

    html += '<div class="prog-grid">';
    html += '<div class="prog-card"><h4>' + esc(t("overallMastery")) + '</h4>';
    html += '<div style="text-align:center;padding:6px 0 4px;">';
    html +=   '<div style="font-size:2.4rem;font-weight:800;">' + avg + '%</div>';
    html +=   '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px;font-weight:600;">' + esc(t("acrossAll")) + '</div>';
    html += '</div></div>';

    html += '<div class="prog-card"><h4>' + esc(t("quizzesTaken")) + '</h4>';
    html += '<div style="text-align:center;padding:6px 0 4px;">';
    html +=   '<div style="font-size:2.4rem;font-weight:800;">' + quizCount + '</div>';
    html +=   '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px;font-weight:600;">' + esc(t("keepGoingMsg")) + '</div>';
    html += '</div></div>';

    html += '<div class="prog-card"><h4>' + esc(t("studyStreak")) + '</h4>';
    html += '<div style="text-align:center;padding:6px 0 4px;">';
    html +=   '<div style="font-size:2.4rem;font-weight:800;">🔥 ' + state.progress.streak.count + '</div>';
    html +=   '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px;font-weight:600;">' + esc(state.progress.streak.count === 1 ? t("day") : t("days")) + '</div>';
    html += '</div></div>';
    html += '</div>';

    html += '<div class="prog-card" style="margin-bottom:16px;"><h4>' + esc(t("subjectMastery")) + '</h4>';
    subjectStats.forEach(function (st) {
      html += '<div class="bar-row">';
      html +=   '<div class="nm">' + st.emoji + ' ' + esc(st.name) + '</div>';
      html +=   '<div class="track"><div class="fill" style="width:' + st.pct + '%;background:var(--brand);"></div></div>';
      html +=   '<div class="pct">' + st.pct + '%</div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="prog-card"><h4>' + esc(t("last4Weeks")) + '</h4>';
    html += '<div class="heat">';
    days.forEach(function (n) {
      let lvl = "";
      if (n > 0) lvl = "l1";
      if (n >= 2) lvl = "l2";
      if (n >= 4) lvl = "l3";
      if (n >= 6) lvl = "l4";
      html += '<div class="day ' + lvl + '"></div>';
    });
    html += '</div>';
    html += '<div style="margin-top:12px;font-size:0.75rem;color:var(--text-muted);font-weight:600;">' + esc(t("heatDesc")) + '</div>';
    html += '</div>';

    if (classQuizzes.length) {
      html += '<div class="prog-card" style="margin-top:16px;"><h4>' + esc(t("recentQuizzes")) + '</h4>';
      classQuizzes.slice(-6).reverse().forEach(function (q) {
        html += '<div class="bar-row">';
        html +=   '<div class="nm" style="width:auto;flex:1;">' + esc(q.subjectName) + ' · ' + esc(q.chapterName) + '</div>';
        html +=   '<div class="pct" style="width:auto;color:' + (q.score >= 60 ? "var(--ok)" : "var(--warn)") + ';">' + q.score + '%</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    view.innerHTML = html;
  }

  $("searchInput").addEventListener("input", function (e) {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;

    const subs = subjects();
    for (let i = 0; i < subs.length; i++) {
      const s = subs[i];
      if (s.name.toLowerCase().indexOf(q) !== -1) {
        setView("subjects", { subjectId: s.id });
        return;
      }
      for (let j = 0; j < s.chapters.length; j++) {
        const c = s.chapters[j];
        if (c.name.toLowerCase().indexOf(q) !== -1 ||
            c.desc.toLowerCase().indexOf(q) !== -1) {
          setView("subjects", { subjectId: s.id });
          return;
        }
      }
    }
  });

  function init() {
    state.notes = loadNotes();
    updateStreak();
    markActivity();
    $("streakNum").textContent = state.progress.streak.count;
    $("searchInput").placeholder = t("searchPlaceholder");
    render();
  }

  init();

})();
</script>
</body>
</html>
